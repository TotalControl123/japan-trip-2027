name: Check the plan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the calendar file from the To book list
        run: node tools/build.mjs
      - name: Check the plan is consistent
        run: node tools/check.mjs
      - name: Save the rebuilt calendar file
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- booking-reminders.ics; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add booking-reminders.ics
            git commit -m "Rebuild booking-reminders.ics from the To book list"
            git push
          fi
